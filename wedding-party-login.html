<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Welcome, Wedding Party · Christy &amp; Mitchell</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wedding-party-login.css">
  <script src="wedding-party-login.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Christy &amp; Mitchell · 12 November 2026</p>
    <h1>Our people.<br>Our day.</h1>
    <p class="intro">A little home for our bridesmaids and groomsmen.<br>The day’s plans, familiar faces, and everything to keep close.</p>
    <form id="hubLoginForm">
      <label for="hubPassword">Wedding party password</label>
      <input id="hubPassword" name="password" type="password" autocomplete="current-password" required minlength="4" maxlength="1024" aria-describedby="hubLoginStatus">
      <button type="submit" id="hubLoginButton">Enter the hub <span aria-hidden="true">→</span></button>
      <p id="hubLoginStatus" role="status" aria-live="polite"></p>
    </form>
    <p class="note">No account or email needed.</p>
  </main>
</body>
</html>
